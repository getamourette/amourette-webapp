<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Photo loading check</title>
<style>
  :root { color-scheme: dark; font: 16px system-ui; background: #180d14; color: #fff5e9; }
  body { max-width: 40rem; margin: auto; padding: 1.25rem; }
  h1 { font-size: 1.5rem; }
  p { line-height: 1.5; }
  input, button { box-sizing: border-box; max-width: 100%; min-height: 48px; font: inherit; }
  button { margin-block: 1rem; padding-inline: 1rem; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .8rem; }
  #sample img { max-width: 160px; max-height: 180px; object-fit: contain; }
</style>
<h1>Photo loading check</h1>
<p>Select the same HEIC from Files. This check runs only on this device. It does not upload or save the photo.</p>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" aria-label="Select the HEIC photo">
<p id="status" role="status">Choose a photo to begin.</p>
<div id="sample"></div>
<button id="copy" disabled>Copy results</button>
<pre id="results"></pre>
<script>
  // Temporary #289 device investigation; remove before review readiness.
  const input = document.querySelector('#file');
  const status = document.querySelector('#status');
  const results = document.querySelector('#results');
  const copy = document.querySelector('#copy');
  const sample = document.querySelector('#sample');
  let running = false;
  const report = { check: 'photo-289-v1', browser: navigator.userAgent, probes: [] };
  const show = () => { results.textContent = JSON.stringify(report, null, 2); };
  const errorText = error => error instanceof Error ? `${error.name}: ${error.message}` : 'Unknown error';
  async function probe(blob, name, attached) {
    const started = performance.now();
    const item = { name, type: blob.type, visibilityAtStart: document.visibilityState };
    report.probes.push(item);
    status.textContent = `Checking ${name}…`;
    const image = new Image();
    image.alt = 'Selected photo, local display only';
    if (attached) sample.append(image);
    const loaded = new Promise(resolve => {
      image.onload = () => { item.loadMs = Math.round(performance.now() - started); item.width = image.naturalWidth; item.height = image.naturalHeight; show(); resolve(); };
      image.onerror = () => { item.imageErrorMs = Math.round(performance.now() - started); show(); resolve(); };
    });
    const url = URL.createObjectURL(blob);
    let timer;
    try {
      image.src = url;
      const decoded = image.decode().then(() => {
        item.decode = 'success'; item.decodeMs = Math.round(performance.now() - started);
        item.width = image.naturalWidth; item.height = image.naturalHeight;
      }, error => { item.decode = errorText(error); item.decodeMs = Math.round(performance.now() - started); });
      await Promise.race([Promise.all([decoded, loaded]), new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error('decode_timeout_6000ms')), 6000);
      })]);
    } catch (error) { item.wait = errorText(error); }
    finally { clearTimeout(timer); }
    item.totalMs = Math.round(performance.now() - started);
    if (image.naturalWidth && image.naturalHeight && image.naturalWidth * image.naturalHeight <= 25000000) {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 1;
        const context = canvas.getContext('2d');
        if (!context) throw new Error('Canvas unavailable');
        context.drawImage(image, 0, 0, 1, 1);
        context.getImageData(0, 0, 1, 1);
        item.canvas = 'success';
      } catch (error) { item.canvas = errorText(error); }
    }
    image.onload = image.onerror = null;
    image.removeAttribute('src');
    image.remove();
    URL.revokeObjectURL(url);
    show();
  }
  input.addEventListener('change', async () => {
    const selected = input.files?.[0];
    input.value = '';
    if (!selected || running) return;
    if (!selected.size || selected.size > 20 * 1024 * 1024) {
      status.textContent = 'Choose a non-empty HEIC no larger than 20 MiB.'; return;
    }
    running = true; input.disabled = true; copy.disabled = true;
    report.probes = []; report.sourceBytes = selected.size; report.deliveredType = selected.type;
    report.visibilityAtSelection = document.visibilityState;
    try {
      let file = selected;
      if (file.type === '' || file.type === 'application/octet-stream') {
        const bytes = new Uint8Array(await file.slice(0, 4096).arrayBuffer());
        const text = offset => String.fromCharCode(...bytes.subarray(offset, offset + 4));
        const size = bytes.length >= 20 ? new DataView(bytes.buffer).getUint32(0) : 0;
        const brands = [];
        if (text(4) === 'ftyp' && size >= 20 && size <= bytes.length && size % 4 === 0) {
          brands.push(text(8));
          for (let offset = 16; offset < size; offset += 4) brands.push(text(offset));
        }
        if (brands.some(brand => brand === 'heic' || brand === 'heix') &&
            !brands.some(brand => ['msf1', 'hevc', 'hevx', 'avis', 'avif'].includes(brand))) {
          file = new File([file], 'photo', { type: 'image/heic', lastModified: file.lastModified });
        }
      }
      if (!['image/heic', 'image/heif'].includes(file.type)) throw new Error('Select the original HEIC from Files.');
      report.normalizedType = file.type;
      await probe(file, 'file-detached', false);
      await probe(file, 'file-attached', true);
      const readStarted = performance.now();
      const bytes = await file.arrayBuffer();
      report.memoryReadMs = Math.round(performance.now() - readStarted);
      await probe(new Blob([bytes], { type: file.type }), 'memory-detached', false);
      if (file.type !== 'image/heic') await probe(new Blob([bytes], { type: 'image/heic' }), 'memory-heic-detached', false);
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      report.sha256 = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
      status.textContent = 'Finished. Copy the results and send them in the task chat.';
    } catch (error) { status.textContent = errorText(error); report.error = errorText(error); }
    finally { running = false; input.disabled = false; copy.disabled = false; show(); }
  });
  copy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(results.textContent); status.textContent = 'Copied. Paste the results in the task chat.'; }
    catch { status.textContent = 'Copy was unavailable. Select the results below, or send a screenshot.'; }
  });
</script>
</html>
