# Temporary: proves the step timeout and single retry used by ci.yml (#445).
name: Install timeout proof
on:
  push:
    branches: [ci/445-chromium-install-timeout]
permissions:
  contents: read
jobs:
  recovers:
    name: apt hangs, then the retry succeeds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install (apt-get update against an unreachable proxy)
        id: chromium
        timeout-minutes: 1
        continue-on-error: true
        run: sh -c "sudo apt-get -o Acquire::http::Proxy=http://10.255.255.1:3128 -o Acquire::https::Proxy=http://10.255.255.1:3128 -o Acquire::Retries=50 update"
      - name: Retry the install once
        if: steps.chromium.outcome == 'failure'
        timeout-minutes: 5
        run: |
          sleep 3
          pgrep -x apt-get > /dev/null && echo "LEFTOVER: apt-get still running 3s after the timeout" || echo "LEFTOVER: none"
          sudo pkill -KILL -x apt-get || true
          npx --yes playwright@1.51.1 install --with-deps chromium
          echo "RETRY: install succeeded"
