name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  # Nightly full suite on main (05:00 UTC: 07:00 Paris, 01:00 New York).
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read
  actions: read

# No shared lock: every browser job starts its own disposable Supabase stack.
# A new push only supersedes the previous run of the same pull request.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      checks: ${{ steps.plan.outputs.checks }}
      browser: ${{ steps.plan.outputs.browser }}
      required_browser: ${{ steps.plan.outputs.required_browser }}
      browser_exemption: ${{ steps.plan.outputs.browser_exemption }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
      reuse: ${{ steps.plan.outputs.reuse }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Classify paths before installing dependencies
        id: paths
        run: node scripts/ci-plan.mjs --paths-only
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
      # TypeScript is needed only for the AST-based dictionary copy exemption.
      - run: npm ci --ignore-scripts
        if: steps.paths.outputs.dictionaries == 'true'
      - name: Select scope and verify prior coverage
        id: plan
        run: node scripts/ci-plan.mjs --github
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}

  checks:
    name: Lint, logic and build
    needs: plan
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: like_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d like_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Require a valid plan
        env:
          RESULT: ${{ needs.plan.result }}
          REUSE: ${{ needs.plan.outputs.reuse }}
        run: |
          test "$RESULT" = success
          if [ -n "$REUSE" ]; then echo "Reused validation: $REUSE. Tests were NOT executed again." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/checkout@v6
        if: needs.plan.outputs.checks == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: needs.plan.outputs.checks == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: needs.plan.outputs.checks == 'true'
      - run: npm run lint
        if: needs.plan.outputs.checks == 'true'
      - run: npm run test:logic
        if: needs.plan.outputs.checks == 'true'
      - name: PostgreSQL 17 transaction ordering
        run: npm run test:like-concurrency
        if: needs.plan.outputs.checks == 'true'
        env:
          LIKE_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/like_test
      - name: Migration ledger command on PostgreSQL 17
        run: npm run test:migration-ledger
        if: needs.plan.outputs.checks == 'true'
        env:
          MIGRATION_LEDGER_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/like_test
      - run: npm run build
        if: needs.plan.outputs.checks == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-only.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-publishable-key
          PROFILE_PHOTO_REVIEW_ENABLED: "false"
          EMAIL_DELIVERY_ENABLED: "false"

      - name: Isolated launch HTTP contracts
        run: npm run test:launch-http
        if: needs.plan.outputs.checks == 'true'

  browser:
    name: Execute browser coverage (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    # The slowest of four full-suite shards takes about 8 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      # Pinned: resolving "latest" calls the GitHub API and fails when rate limited.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Start the disposable Supabase stack
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,mailpit,postgres-meta
      - name: Apply migrations in filename order
        run: |
          set -euo pipefail
          # The hosted project receives migrations through a role without Supabase's
          # default grants; migrations state every grant they need. Match that here.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q <<'SQL'
          alter default privileges for role postgres in schema public revoke all on tables from anon, authenticated, service_role;
          alter default privileges for role postgres in schema public revoke all on sequences from anon, authenticated, service_role;
          alter default privileges for role postgres in schema public revoke all on functions from anon, authenticated, service_role;
          SQL
          # Duplicated version prefixes rule out the CLI migration tracker.
          for file in $(ls supabase/migrations/*.sql | sort); do
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -1 -f "$file" > /dev/null
          done
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql "$DB_URL" -c "notify pgrst, 'reload schema'"
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Export the local stack keys
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/supabase.env"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - run: npm ci
      # No --with-deps: the ubuntu-24.04 image already has every library Chromium
      # needs, and the apt run behind that flag (extra fonts only) stalled twice.
      # Takes about 10 seconds. Capped and retried once: the download can stall too.
      - name: Install locked Chromium
        id: chromium
        timeout-minutes: 3
        continue-on-error: true
        run: npx playwright install chromium
      - name: Retry the Chromium install once
        if: steps.chromium.outcome == 'failure'
        timeout-minutes: 3
        run: npx playwright install chromium
      - name: Build and run isolated browser journeys
        run: node scripts/ci-plan.mjs --run
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          E2E_FIXTURE_AUTH: password
          PROFILE_PHOTO_REVIEW_ENABLED: "false"
          EMAIL_DELIVERY_ENABLED: "false"
      - name: Encrypt browser failure evidence for the public repository
        if: ${{ failure() && !cancelled() }}
        run: node scripts/e2e-artifacts.mjs encrypt
        env:
          E2E_ARTIFACT_KEY: ${{ secrets.E2E_ARTIFACT_KEY }}
      - name: Retain encrypted browser failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: e2e-diagnostics.enc
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Playwright Chromium mobile
    needs: [plan, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify browser coverage or explain exemption
        env:
          PLAN: ${{ needs.plan.result }}
          BROWSER: ${{ needs.browser.result }}
          EXECUTE: ${{ needs.plan.outputs.browser }}
          REQUIRED: ${{ needs.plan.outputs.required_browser }}
          MODE: ${{ needs.plan.outputs.mode }}
          REUSE: ${{ needs.plan.outputs.reuse }}
          EXEMPTION: ${{ needs.plan.outputs.browser_exemption }}
        run: |
          test "$PLAN" = success
          if [ -n "$REUSE" ]; then
            echo "Reused validation: $REUSE. Tests were NOT executed again." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EXECUTE" = true ]; then
            test "$BROWSER" = success
            echo "Executed browser coverage: $MODE." >> "$GITHUB_STEP_SUMMARY"
          else
            test "$REQUIRED" = false
            if [ -n "$EXEMPTION" ]; then
              echo "Browser tests NOT executed: $EXEMPTION" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Browser tests NOT executed: scope $MODE, documented docs/copy exemption." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ -n "$REUSE" ] && [ -n "$EXEMPTION" ]; then echo "$EXEMPTION" >> "$GITHUB_STEP_SUMMARY"; fi

  evidence:
    # Machine-readable provenance in GitHub's jobs API. Only fresh successful
    # validations produce evidence; reuse cannot form an unbounded proof chain.
    name: CI evidence v1 ${{ needs.plan.outputs.base }} ${{ needs.plan.outputs.head }} ${{ needs.plan.outputs.mode }} ${{ needs.plan.outputs.required_browser }}
    needs: [plan, checks, e2e]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.checks.result == 'success' && needs.e2e.result == 'success' && needs.plan.outputs.reuse == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo 'Fresh validation completed. See the two required checks for actual coverage.'
