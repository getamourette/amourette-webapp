name: Recover protected diagnostic evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.1'
      - name: Verify the original failed-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/getamourette/amourette-webapp/actions/artifacts/11321289615 > source-metadata.json
          node -e 'const a=require("./source-metadata.json"); if(a.expired || a.name!=="playwright-failure-37254287219-1" || a.workflow_run.id!==37254287219 || a.workflow_run.head_sha!=="e9d11a935e490ea5718ea570a8e190ae187c6ed6") throw new Error("Unexpected or expired source artifact");'
          gh run download 37254287219 --repo getamourette/amourette-webapp --name playwright-failure-37254287219-1 --dir source
      - name: Protect diagnostics for the local recipient
        env:
          E2E_ARTIFACT_KEY: ${{ secrets.E2E_ARTIFACT_KEY }}
        run: node rewrap.cjs
      - name: Retain only recipient-encrypted diagnostics
        uses: actions/upload-artifact@v5
        with:
          name: recipient-encrypted-diagnostics
          path: protected-diagnostics.enc
          retention-days: 1
          if-no-files-found: error
