name: Review trace

# Catches a pull request marked Ready without a review, or with a fast lane its
# files do not allow, whatever session opened it.
# Rule: AGENTS.md, "Automatic review". It reads the pull request live, so it reruns
# when the description changes (the founder card is always written last).
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  # Reports in the merge queue too, so that the founder can make this check
  # required without blocking the queue (docs/decisions/2026-11-25-repository-scanning.md).
  # The pull request was already judged before it entered the queue.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: review-trace-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review-trace:
    name: Review trace
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - if: ${{ github.event_name == 'merge_group' }}
        run: echo "Judged on the pull request before it entered the merge queue."
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/review-trace.mjs "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
      # The review lane (docs/workflow.md, "Review lanes"): fails a Ready pull
      # request whose card announces the fast lane for sensitive files.
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: node scripts/review-lane.mjs "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
